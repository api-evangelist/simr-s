aid: simr-s
name: Simr
description: >-
  Simr (a registered trademark of The UberCloud, Inc., based in Los Altos,
  California) is a Simulation Operations Automation (SimOps) platform that
  streamlines complex engineering simulations across the product-development
  lifecycle. It provides self-service, automated infrastructure for running CFD,
  FEA, multi-physics, and system-level simulations with major solvers such as
  ANSYS, Abaqus, and COMSOL, deploying directly into customer-owned cloud
  environments on AWS, Azure, and Google Cloud, or on-premises. Simr targets
  enterprise manufacturers, reducing operational overhead for engineering teams
  while keeping data control and compliance security-first. It was surfaced as a
  portfolio company of Earlybird and profiled in the API Evangelist network; as
  of this pass Simr publishes no public API, developer portal, SDK, or
  machine-readable API surface.
